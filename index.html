<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pendientes de Gael</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: una sola columna estrecha; encabezado con progreso, luego la lista como filas que se tocan para marcar. */
:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --ink: #17231d;
  --muted: #5d6b63;
  --line: #d9e0db;
  --accent: #1f7a4d;
  --accent-soft: #dcefe4;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Figtree", "Helvetica Neue", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101612; --surface: #18201b; --ink: #e6ede8; --muted: #95a59b;
    --line: #2a352f; --accent: #5cc98f; --accent-soft: #1d3428; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 1rem; line-height: 1.5; }
.wrap {
  max-width: 34rem; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 3rem 4rem;
  display: grid; gap: 1.75rem;
}
header { display: grid; gap: .75rem; }
.eyebrow { font-family: var(--mono); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(2rem, 7vw, 2.75rem); line-height: 1.05; margin: 0; text-wrap: balance; }
.progress { display: flex; align-items: center; gap: .75rem; }
.bar { flex: 1; height: .5rem; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
.count { font-family: var(--mono); font-size: .875rem; font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
ul { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
li + li { border-top: 1px solid var(--line); }
.item {
  width: 100%; display: flex; align-items: center; gap: .875rem;
  padding: 1rem 1.125rem; background: none; border: 0; color: inherit;
  font: inherit; text-align: left; cursor: pointer;
}
.item:hover { background: var(--accent-soft); }
.item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.box {
  flex: none; width: 1.375rem; height: 1.375rem; border-radius: 6px;
  border: 2px solid var(--muted); display: grid; place-items: center;
  transition: background .15s, border-color .15s;
}
.box svg { width: .875rem; height: .875rem; opacity: 0; }
.box svg path { stroke: var(--surface); }
.item[aria-checked="true"] .box { background: var(--accent); border-color: var(--accent); }
.item[aria-checked="true"] .box svg { opacity: 1; }
.label { min-width: 0; flex: 1; }
.item[aria-checked="true"] .label { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--accent); }
.status { font-size: .875rem; color: var(--muted); min-height: 1.3em; margin: 0; }
@media (prefers-reduced-motion: reduce) { .bar > span, .box { transition: none; } }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <span class="eyebrow">Lista de arranque</span>
    <h1>Pendientes de Gael</h1>
    <div class="progress" id="progress"></div>
  </header>
  <ul id="list"></ul>
  <p class="status" id="status" aria-live="polite">Conectando…</p>
</main>

<script type="module">
// ====== Configuración del proyecto de Firebase "pendientes-gael" ======
// Es pública a propósito; lo que protege la lista son las reglas de firestore.rules.
const firebaseConfig = {
  apiKey: "AIzaSyDwbSEkd59gknaIuREXo6gLCWndYrzbyW8",
  authDomain: "pendientes-gael.firebaseapp.com",
  projectId: "pendientes-gael",
  storageBucket: "pendientes-gael.firebasestorage.app",
  messagingSenderId: "980648745123",
  appId: "1:980648745123:web:49531e45db635c65fb0716"
};
// ======================================================================

// Las tareas. Para agregar una, copia una línea con un id nuevo (t6, t7…)
// y agrega ese id también en las reglas de Firestore.
const TAREAS = [
  { id: "t1", t: "Dar de alta GitHub" },
  { id: "t2", t: "Hacer carpeta git" },
  { id: "t3", t: "Hacer carpeta Gael dentro de carpeta git" },
  { id: "t4", t: "Registrar Claude con pago" },
  { id: "t5", t: "Enviar link con esta lista" }
];

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const listEl = document.getElementById("list");
const progEl = document.getElementById("progress");
const statusEl = document.getElementById("status");
const CHECK = '<svg viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5l3 3 6-7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
let hechas = {};

function render() {
  listEl.innerHTML = TAREAS.map(x =>
    `<li><button class="item" type="button" role="checkbox" aria-checked="${!!hechas[x.id]}" data-id="${x.id}"><span class="box">${CHECK}</span><span class="label"></span></button></li>`
  ).join("");
  listEl.querySelectorAll(".label").forEach((el, i) => { el.textContent = TAREAS[i].t; });
  const done = TAREAS.filter(x => hechas[x.id]).length;
  const pct = Math.round(done / TAREAS.length * 100);
  progEl.innerHTML = `<div class="bar"><span style="width:${pct}%"></span></div><span class="count">${done} de ${TAREAS.length} hechos</span>`;
}
render();

if (firebaseConfig.apiKey === "PEGA_AQUI") {
  statusEl.textContent = "Falta pegar la configuración de Firebase en index.html. Las marcas todavía no se guardan.";
} else {
  const db = getFirestore(initializeApp(firebaseConfig));
  const ref = doc(db, "listas", "pendientes");

  onSnapshot(ref, snap => {
    hechas = (snap.exists() && snap.data().hechas) || {};
    render();
    statusEl.textContent = "Cualquiera con este link puede marcar tareas. Todos ven los cambios al momento.";
  }, () => {
    statusEl.textContent = "No se pudo conectar con la lista. Revisa tu conexión y recarga la página.";
  });

  listEl.addEventListener("click", ev => {
    const btn = ev.target.closest(".item");
    if (!btn) return;
    const id = btn.dataset.id;
    const next = !hechas[id];
    hechas = { ...hechas, [id]: next };
    render();
    listEl.querySelector(`[data-id="${id}"]`)?.focus();
    setDoc(ref, { hechas: { [id]: next } }, { merge: true }).catch(() => {
      statusEl.textContent = "No se pudo guardar el cambio. Vuelve a intentarlo.";
    });
  });
}
</script>
</body>
</html>
